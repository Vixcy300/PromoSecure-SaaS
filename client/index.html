<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Primary Meta Tags -->
    <title>PromoSecure | Enterprise-Grade Privacy-First Promotional Verification</title>
    <meta name="title" content="PromoSecure | Enterprise-Grade Privacy-First Promotional Verification" />
    <meta name="description" content="PromoSecure is a privacy-focused SaaS platform for promotional verification. Secure your brand campaigns with AI face blurring, offline data sync, and cryptographic watermarking." />
    <meta name="keywords" content="promotional verification, privacy SaaS, AI face blurring, offline sync, enterprise security, brand management, field marketing" />
    <meta name="author" content="PromoSecure Team" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://promosecure.vercel.app/" />
    <meta property="og:title" content="PromoSecure | Enterprise-Grade Privacy-First Promotional Verification" />
    <meta property="og:description" content="Secure your brand campaigns with AI face blurring, offline data sync, and cryptographic watermarking. Ultimate privacy for field marketing." />
    <meta property="og:image" content="https://promosecure.vercel.app/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://promosecure.vercel.app/" />
    <meta property="twitter:title" content="PromoSecure | Enterprise-Grade Privacy-First Promotional Verification" />
    <meta property="twitter:description" content="Secure your brand campaigns with AI face blurring, offline data sync, and cryptographic watermarking. Ultimate privacy for field marketing." />
    <meta property="twitter:image" content="https://promosecure.vercel.app/og-image.jpg" />

    <meta name="theme-color" content="#0f0f23" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#ffffff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;user-select:none">
        <style>
          @keyframes ps-init-spin { 0% { opacity: 0.15; } 100% { opacity: 1; } }
          .ps-init-spinner { position:relative; width:24px; height:24px; margin-bottom:16px; }
          .ps-init-bar { position:absolute; height:8%; width:24%; left:-10%; top:-3.9%; border-radius:5px; background:#8f8f8f; animation:ps-init-spin 1.2s linear infinite; }
        </style>
        <div class="ps-init-spinner">
          <div class="ps-init-bar" style="animation-delay:-1.2s;transform:rotate(.0001deg) translate(146%)"></div>
          <div class="ps-init-bar" style="animation-delay:-1.1s;transform:rotate(30deg) translate(146%)"></div>
          <div class="ps-init-bar" style="animation-delay:-1.0s;transform:rotate(60deg) translate(146%)"></div>
          <div class="ps-init-bar" style="animation-delay:-0.9s;transform:rotate(90deg) translate(146%)"></div>
          <div class="ps-init-bar" style="animation-delay:-0.8s;transform:rotate(120deg) translate(146%)"></div>
          <div class="ps-init-bar" style="animation-delay:-0.7s;transform:rotate(150deg) translate(146%)"></div>
          <div class="ps-init-bar" style="animation-delay:-0.6s;transform:rotate(180deg) translate(146%)"></div>
          <div class="ps-init-bar" style="animation-delay:-0.5s;transform:rotate(210deg) translate(146%)"></div>
          <div class="ps-init-bar" style="animation-delay:-0.4s;transform:rotate(240deg) translate(146%)"></div>
          <div class="ps-init-bar" style="animation-delay:-0.3s;transform:rotate(270deg) translate(146%)"></div>
          <div class="ps-init-bar" style="animation-delay:-0.2s;transform:rotate(300deg) translate(146%)"></div>
          <div class="ps-init-bar" style="animation-delay:-0.1s;transform:rotate(330deg) translate(146%)"></div>
        </div>
        <div style="font-size:0.9rem;color:#8f8f8f;font-weight:500;letter-spacing:0.01em">Loading PromoSecure</div>
      </div>
    </div>
    <script>
      // Catch ALL errors BEFORE module scripts run
      window.onerror = function(msg, src, line, col, err) {
        document.body.innerHTML = '<div style="padding:2rem;background:#ffebee;color:#b71c1c;font-family:monospace;min-height:100vh"><h2>JavaScript Error:</h2><p><b>' + msg + '</b></p><p>File: ' + src + ':' + line + ':' + col + '</p><pre style="background:white;padding:1rem;white-space:pre-wrap">' + (err ? err.stack : 'No stack available') + '</pre></div>';
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML += '<div style="padding:2rem;background:#fff3e0;color:#e65100;font-family:monospace"><h2>Promise Rejection:</h2><p>' + e.reason + '</p><pre style="background:white;padding:1rem;white-space:pre-wrap">' + (e.reason && e.reason.stack ? e.reason.stack : 'No stack') + '</pre></div>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
