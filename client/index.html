<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Primary Meta Tags -->
    <title>PromoSecure | Enterprise-Grade Privacy-First Promotional Verification</title>
    <meta name="title" content="PromoSecure | Enterprise-Grade Privacy-First Promotional Verification" />
    <meta name="description" content="PromoSecure is a privacy-focused SaaS platform for promotional verification. Secure your brand campaigns with AI face blurring, offline data sync, and cryptographic watermarking." />
    <meta name="keywords" content="promotional verification, privacy SaaS, AI face blurring, offline sync, enterprise security, brand management, field marketing" />
    <meta name="author" content="PromoSecure Team" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://promosecure.vercel.app/" />
    <meta property="og:title" content="PromoSecure | Enterprise-Grade Privacy-First Promotional Verification" />
    <meta property="og:description" content="Secure your brand campaigns with AI face blurring, offline data sync, and cryptographic watermarking. Ultimate privacy for field marketing." />
    <meta property="og:image" content="https://promosecure.vercel.app/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://promosecure.vercel.app/" />
    <meta property="twitter:title" content="PromoSecure | Enterprise-Grade Privacy-First Promotional Verification" />
    <meta property="twitter:description" content="Secure your brand campaigns with AI face blurring, offline data sync, and cryptographic watermarking. Ultimate privacy for field marketing." />
    <meta property="twitter:image" content="https://promosecure.vercel.app/og-image.jpg" />

    <meta name="theme-color" content="#0f0f23" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"><div style="padding:40px;font-family:monospace;font-size:18px;background:#fff;color:#333;min-height:100vh">Loading PromoSecure...</div></div>
    <script>
      // Catch ALL errors BEFORE module scripts run
      window.onerror = function(msg, src, line, col, err) {
        document.body.innerHTML = '<div style="padding:2rem;background:#ffebee;color:#b71c1c;font-family:monospace;min-height:100vh"><h2>JavaScript Error:</h2><p><b>' + msg + '</b></p><p>File: ' + src + ':' + line + ':' + col + '</p><pre style="background:white;padding:1rem;white-space:pre-wrap">' + (err ? err.stack : 'No stack available') + '</pre></div>';
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML += '<div style="padding:2rem;background:#fff3e0;color:#e65100;font-family:monospace"><h2>Promise Rejection:</h2><p>' + e.reason + '</p><pre style="background:white;padding:1rem;white-space:pre-wrap">' + (e.reason && e.reason.stack ? e.reason.stack : 'No stack') + '</pre></div>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
