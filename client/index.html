<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Primary Meta Tags -->
    <title>PromoSecure | Enterprise-Grade Privacy-First Promotional Verification</title>
    <meta name="title" content="PromoSecure | Enterprise-Grade Privacy-First Promotional Verification" />
    <meta name="description" content="PromoSecure is a privacy-focused SaaS platform for promotional verification. Secure your brand campaigns with AI face blurring, offline data sync, and cryptographic watermarking." />
    <meta name="keywords" content="promotional verification, privacy SaaS, AI face blurring, offline sync, enterprise security, brand management, field marketing" />
    <meta name="author" content="PromoSecure Team" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://promosecure.vercel.app/" />
    <meta property="og:title" content="PromoSecure | Enterprise-Grade Privacy-First Promotional Verification" />
    <meta property="og:description" content="Secure your brand campaigns with AI face blurring, offline data sync, and cryptographic watermarking. Ultimate privacy for field marketing." />
    <meta property="og:image" content="https://promosecure.vercel.app/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://promosecure.vercel.app/" />
    <meta property="twitter:title" content="PromoSecure | Enterprise-Grade Privacy-First Promotional Verification" />
    <meta property="twitter:description" content="Secure your brand campaigns with AI face blurring, offline data sync, and cryptographic watermarking. Ultimate privacy for field marketing." />
    <meta property="twitter:image" content="https://promosecure.vercel.app/og-image.jpg" />

    <meta name="theme-color" content="#0f0f23" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#000000;color:#ffffff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;padding:20px;user-select:none;position:relative;overflow:hidden">
        <style>
          @keyframes ps-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
          }
          @keyframes ps-pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 0.2; }
          }
          .ps-shimmer-text {
            background: linear-gradient(90deg, #ffffff 0%, #60a5fa 50%, #ffffff 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: ps-shimmer 2.5s linear infinite;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
          }
          .ps-icon-wrapper {
            position: relative;
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: linear-gradient(135deg, #2563eb, #4338ca);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 0 35px rgba(37, 99, 235, 0.55);
            border: 1px solid rgba(147, 197, 253, 0.35);
          }
          .ps-icon-pulse {
            position: absolute;
            inset: -4px;
            border-radius: 22px;
            border: 2px solid #3b82f6;
            animation: ps-pulse 2s ease-in-out infinite;
          }
        </style>
        <div style="position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,0.18) 0%,rgba(0,0,0,0) 70%);filter:blur(30px);pointer-events:none"></div>
        <div class="ps-icon-wrapper">
          <div class="ps-icon-pulse"></div>
          <svg width="38" height="38" viewBox="0 0 20 20" fill="currentColor" style="color:#ffffff">
            <path fill-rule="evenodd" d="M10 1.944A11.954 11.954 0 012.166 5C2.056 5.649 2 6.319 2 7c0 5.225 3.34 9.67 8 11.317C14.66 16.67 18 12.225 18 7c0-.682-.057-1.35-.166-2.001A11.954 11.954 0 0110 1.944zM11 14a1 1 0 11-2 0 1 1 0 012 0zm0-7a1 1 0 10-2 0v3a1 1 0 102 0V7z" clip-rule="evenodd" />
          </svg>
        </div>
        <div class="ps-shimmer-text">Loading PromoSecure...</div>
        <div style="font-size:0.85rem;color:#9ca3af;margin-top:8px;font-weight:500">Enterprise Privacy-First Verification</div>
      </div>
    </div>
    <script>
      // Catch ALL errors BEFORE module scripts run
      window.onerror = function(msg, src, line, col, err) {
        document.body.innerHTML = '<div style="padding:2rem;background:#ffebee;color:#b71c1c;font-family:monospace;min-height:100vh"><h2>JavaScript Error:</h2><p><b>' + msg + '</b></p><p>File: ' + src + ':' + line + ':' + col + '</p><pre style="background:white;padding:1rem;white-space:pre-wrap">' + (err ? err.stack : 'No stack available') + '</pre></div>';
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML += '<div style="padding:2rem;background:#fff3e0;color:#e65100;font-family:monospace"><h2>Promise Rejection:</h2><p>' + e.reason + '</p><pre style="background:white;padding:1rem;white-space:pre-wrap">' + (e.reason && e.reason.stack ? e.reason.stack : 'No stack') + '</pre></div>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
